spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: pms-backend
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
    open-in-view: false
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    enabled: ${PMS_SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${PMS_SWAGGER_ENABLED:true}

app:
  timezone:
    storage: UTC
    display: Asia/Manila
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized